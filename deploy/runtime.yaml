AWSTemplateFormatVersion: "2010-09-09"
Description: IAM-authenticated HTTP Decider runtime for Nevermind; synthetic demonstration only, no anonymous inference.
Metadata:
  AWSToolsMetrics:
    AWSAgentToolkit: aws-cloudformation@v2
Parameters:
  RuntimeName:
    Type: String
    Default: nevermind_decider
    AllowedPattern: "[A-Za-z][A-Za-z0-9_]{0,47}"
  ImageUri:
    Type: String
    AllowedPattern: "[0-9]{12}\\.dkr\\.ecr\\.[a-z0-9-]+\\.amazonaws\\.com/[a-z0-9/_.-]+@sha256:[a-f0-9]{64}"
  RepositoryArn:
    Type: String
    AllowedPattern: "arn:aws:ecr:[a-z0-9-]+:[0-9]{12}:repository/[a-z0-9/_.-]+"
  LogKeyArn:
    Type: String
    AllowedPattern: "arn:aws:kms:[a-z0-9-]+:[0-9]{12}:key/[a-f0-9-]+"
Resources:
  RuntimeRole:
    Type: AWS::IAM::Role
    Metadata:
      com.aws.cloudformation.Context:
        why: Model hosting needs only private image reads and writes to its own log groups.
        must: [No Bedrock generation or database mutation permissions; retain IAM inbound authentication.]
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: {Service: bedrock-agentcore.amazonaws.com}
            Action: sts:AssumeRole
            Condition:
              StringEquals: {aws:SourceAccount: !Ref "AWS::AccountId"}
              ArnLike:
                aws:SourceArn: !Sub "arn:${AWS::Partition}:bedrock-agentcore:${AWS::Region}:${AWS::AccountId}:runtime/${RuntimeName}-*"
      Policies:
        - PolicyName: ReadImageAndWriteLogs
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: ecr:GetAuthorizationToken
                Resource: "*"
              - Effect: Allow
                Action: [ecr:BatchGetImage, ecr:GetDownloadUrlForLayer]
                Resource: !Ref RepositoryArn
              - Effect: Allow
                Action: [logs:DescribeLogStreams, logs:CreateLogStream, logs:PutLogEvents]
                Resource: !Sub "arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/bedrock-agentcore/runtimes/${RuntimeName}-*"
  Runtime:
    Type: AWS::BedrockAgentCore::Runtime
    Metadata:
      com.aws.cloudformation.Context:
        why: Host the pinned, compressed Decider model on demand.
        must:
          - HTTP protocol on ARM64; inbound authentication is IAM by default.
          - PUBLIC selects outbound networking for model downloads, not anonymous authorization.
          - Use only synthetic inputs; idle sessions expire after 60 seconds.
    Properties:
      AgentRuntimeName: !Ref RuntimeName
      AgentRuntimeArtifact:
        ContainerConfiguration: {ContainerUri: !Ref ImageUri}
      RoleArn: !GetAtt RuntimeRole.Arn
      NetworkConfiguration: {NetworkMode: PUBLIC}
      ProtocolConfiguration: HTTP
      LifecycleConfiguration: {IdleRuntimeSessionTimeout: 60, MaxLifetime: 1800}
      EnvironmentVariables:
        DECIDER_MODEL: StrandsAgents/strands-decider-2B-qwen3.5-v1-2610
        DECIDER_REVISION: 216d1ccb46a9e9b036eb9187b248db98480f77d4
        DECIDER_QUANT: int8
        DECIDER_MAX_TOKENS: "2048"
        DECIDER_MAX_QUESTIONS: "8"
        DECIDER_MAX_BATCH: "1"
        DECIDER_THREADS: "2"
        DECIDER_WARMUP: "1"
        DECIDER_LOAD_TIMEOUT_S: "600"
  DefaultLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/bedrock-agentcore/runtimes/${Runtime.AgentRuntimeId}-DEFAULT"
      KmsKeyId: !Ref LogKeyArn
      RetentionInDays: 3
  EndpointLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/bedrock-agentcore/runtimes/${Runtime.AgentRuntimeId}-probe"
      KmsKeyId: !Ref LogKeyArn
      RetentionInDays: 3
  Endpoint:
    Type: AWS::BedrockAgentCore::RuntimeEndpoint
    DependsOn: [DefaultLogs, EndpointLogs]
    Metadata:
      com.aws.cloudformation.Context:
        why: Explicitly promote the version produced by this stack update.
        must: [Application qualifier stays probe; configure encrypted logs before invocation.]
    Properties:
      AgentRuntimeId: !GetAtt Runtime.AgentRuntimeId
      AgentRuntimeVersion: !GetAtt Runtime.AgentRuntimeVersion
      Name: probe
Outputs:
  RuntimeArn:
    Description: Pass this ARN to the application deployment.
    Value: !GetAtt Runtime.AgentRuntimeArn
  RuntimeId:
    Description: Runtime identifier for diagnostics.
    Value: !GetAtt Runtime.AgentRuntimeId
  RuntimeQualifier:
    Description: Endpoint name used by the application.
    Value: probe
