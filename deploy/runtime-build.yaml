AWSTemplateFormatVersion: "2010-09-09"
Description: Private ARM64 Decider image builds for the Nevermind demonstration; no model inference is started here.
Metadata:
  AWSToolsMetrics:
    AWSAgentToolkit: aws-cloudformation@v2
Resources:
  Sources:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Metadata:
      com.aws.cloudformation.Context:
        why: Versioned, private build inputs supplied by the deployment script.
        must: [Never upload credentials or runtime data; retain for deliberate cleanup.]
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        IgnorePublicAcls: true
        BlockPublicPolicy: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: {SSEAlgorithm: AES256}
      VersioningConfiguration: {Status: Enabled}
      LifecycleConfiguration:
        Rules:
          - Id: OldInputs
            Status: Enabled
            NoncurrentVersionExpiration: {NoncurrentDays: 7}
            AbortIncompleteMultipartUpload: {DaysAfterInitiation: 1}
  SourcesPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref Sources
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Deny
            Principal: "*"
            Action: s3:*
            Resource: [!GetAtt Sources.Arn, !Sub "${Sources.Arn}/*"]
            Condition: {Bool: {aws:SecureTransport: false}}
  Images:
    Type: AWS::ECR::Repository
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Metadata:
      com.aws.cloudformation.Context:
        why: Private immutable image versions; updates deploy the resolved image digest.
        must: [Keep tagged images for rollback; delete only with explicit approval.]
    Properties:
      ImageTagMutability: IMMUTABLE
      ImageScanningConfiguration: {ScanOnPush: true}
      EncryptionConfiguration: {EncryptionType: AES256}
      LifecyclePolicy:
        LifecyclePolicyText: |
          {"rules":[{"rulePriority":1,"description":"Expire untagged layers after seven days","selection":{"tagStatus":"untagged","countType":"sinceImagePushed","countUnit":"days","countNumber":7},"action":{"type":"expire"}}]}
  LogKey:
    Type: AWS::KMS::Key
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Metadata:
      com.aws.cloudformation.Context:
        why: Encrypt build and model runtime logs in the same account and region.
        must: [Retain while any encrypted logs exist; restrict use by encryption context.]
    Properties:
      Description: Nevermind model build and runtime log encryption
      EnableKeyRotation: true
      KeyPolicy:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: {AWS: !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:root"}
            Action: kms:*
            Resource: "*"
          - Effect: Allow
            Principal: {Service: !Sub "logs.${AWS::Region}.amazonaws.com"}
            Action: [kms:Encrypt, kms:Decrypt, "kms:ReEncrypt*", "kms:GenerateDataKey*", kms:DescribeKey]
            Resource: "*"
            Condition:
              ArnLike:
                kms:EncryptionContext:aws:logs:arn:
                  - !Sub "arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/codebuild/${AWS::StackName}"
                  - !Sub "arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/bedrock-agentcore/runtimes/*"
  BuildLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/codebuild/${AWS::StackName}"
      KmsKeyId: !GetAtt LogKey.Arn
      RetentionInDays: 3
  BuildRole:
    Type: AWS::IAM::Role
    Metadata:
      com.aws.cloudformation.Context:
        why: CodeBuild can read only these build inputs and push only this repository.
        must: [Scope the trust to this project and account.]
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: {Service: codebuild.amazonaws.com}
            Action: sts:AssumeRole
            Condition:
              StringEquals: {aws:SourceAccount: !Ref "AWS::AccountId"}
              ArnEquals:
                aws:SourceArn: !Sub "arn:${AWS::Partition}:codebuild:${AWS::Region}:${AWS::AccountId}:project/${AWS::StackName}"
      Policies:
        - PolicyName: BuildOneImage
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: [s3:GetObject, s3:GetObjectVersion]
                Resource: !Sub "${Sources.Arn}/input/*"
              - Effect: Allow
                Action: [s3:GetBucketLocation, s3:GetBucketAcl]
                Resource: !GetAtt Sources.Arn
              - Effect: Allow
                Action: ecr:GetAuthorizationToken
                Resource: "*"
              - Effect: Allow
                Action: [ecr:BatchCheckLayerAvailability, ecr:InitiateLayerUpload, ecr:UploadLayerPart, ecr:CompleteLayerUpload, ecr:PutImage, ecr:BatchGetImage, ecr:GetDownloadUrlForLayer]
                Resource: !GetAtt Images.Arn
              - Effect: Allow
                Action: [logs:CreateLogStream, logs:PutLogEvents]
                Resource: !Sub "${BuildLogs.Arn}"
  Build:
    Type: AWS::CodeBuild::Project
    Metadata:
      com.aws.cloudformation.Context:
        why: Build on ARM64 without installing Docker or model weights on the developer machine.
        must: [No webhook builds; bounded build time and one concurrent build.]
    Properties:
      Name: !Ref "AWS::StackName"
      ServiceRole: !GetAtt BuildRole.Arn
      Artifacts: {Type: NO_ARTIFACTS}
      Source:
        Type: S3
        Location: !Sub "${Sources}/input/source.zip"
        BuildSpec: buildspec.yml
      Environment:
        Type: ARM_CONTAINER
        ComputeType: BUILD_GENERAL1_SMALL
        Image: aws/codebuild/amazonlinux-aarch64-standard:3.0
        PrivilegedMode: true
        ImagePullCredentialsType: CODEBUILD
      TimeoutInMinutes: 25
      QueuedTimeoutInMinutes: 5
      ConcurrentBuildLimit: 1
      LogsConfig:
        CloudWatchLogs: {Status: ENABLED, GroupName: !Ref BuildLogs}
Outputs:
  SourceBucket:
    Description: Private versioned build source bucket.
    Value: !Ref Sources
  RepositoryUri:
    Description: Private immutable image repository URI.
    Value: !GetAtt Images.RepositoryUri
  RepositoryArn:
    Description: Repository ARN for the runtime execution policy.
    Value: !GetAtt Images.Arn
  RepositoryName:
    Description: Repository name for resolving the built image digest.
    Value: !Ref Images
  BuildProject:
    Description: ARM64 build project name.
    Value: !Ref Build
  LogKeyArn:
    Description: Log encryption key passed explicitly to the runtime stack.
    Value: !GetAtt LogKey.Arn
